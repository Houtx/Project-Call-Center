name: project-call-center

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-3}

x-api-environment: &api-environment
  NODE_ENV: production
  NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=384}
  API_PORT: "8800"
  TZ: Asia/Shanghai
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env.production}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env.production}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
  PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:?set PHONE_ENCRYPTION_KEY in deploy/.env.production}
  PHONE_HASH_KEY: ${PHONE_HASH_KEY:?set PHONE_HASH_KEY in deploy/.env.production}
  WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in deploy/.env.production}
  TRUST_PROXY: "true"
  RECORDINGS_DIR: /var/lib/project-call-center/recordings
  RECORDING_ENCRYPTION_KEY: ${RECORDING_ENCRYPTION_KEY:?set RECORDING_ENCRYPTION_KEY in deploy/.env.production}
  BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-true}
  BACKGROUND_RECONCILIATION_INTERVAL_MS: ${BACKGROUND_RECONCILIATION_INTERVAL_MS:-60000}
  BACKGROUND_HOUSEKEEPING_INTERVAL_MS: ${BACKGROUND_HOUSEKEEPING_INTERVAL_MS:-3600000}
  TECHNICAL_DATA_RETENTION_DAYS: ${TECHNICAL_DATA_RETENTION_DAYS:-7}
  HOUSEKEEPING_BATCH_SIZE: ${HOUSEKEEPING_BATCH_SIZE:-5000}
  IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-10000}
  BULK_ASSIGNMENT_MAX_QUANTITY: ${BULK_ASSIGNMENT_MAX_QUANTITY:-10000}
  BULK_ASSIGNMENT_SCAN_MAX_ROWS: ${BULK_ASSIGNMENT_SCAN_MAX_ROWS:-100000}

x-api-service: &api-service
  image: ${API_IMAGE:-project-call-center-api:0.5.0}
  build:
    context: ..
    dockerfile: apps/api/Dockerfile
  environment: *api-environment
  networks:
    - call-center
  restart: unless-stopped
  mem_limit: ${API_MEMORY_LIMIT:-512m}
  cpus: ${API_CPU_LIMIT:-1.0}
  pids_limit: ${API_PIDS_LIMIT:-128}
  logging: *default-logging
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  volumes:
    - recordings-data:/var/lib/project-call-center/recordings

services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-40}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-96MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-256MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-32MB}
      - -c
      - autovacuum_work_mem=${POSTGRES_AUTOVACUUM_WORK_MEM:-32MB}
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=${POSTGRES_CHECKPOINT_TIMEOUT:-15min}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-512MB}
      - -c
      - min_wal_size=${POSTGRES_MIN_WAL_SIZE:-80MB}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-call_center}
      POSTGRES_USER: ${POSTGRES_USER:-call_center}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.production}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - call-center
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-128}
    logging: *default-logging
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *api-service
    command:
      - node
      - node_modules/prisma/build/index.js
      - migrate
      - deploy
      - --schema
      - apps/api/prisma/schema.prisma
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap-admin:
    <<: *api-service
    command: ["node", "apps/api/dist/prisma/bootstrap-admin.js"]
    environment:
      <<: *api-environment
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-系统管理员}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api-service
    ports:
      - "127.0.0.1:${API_LOOPBACK_PORT:-18800}:8800"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8800/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 20

  worker:
    <<: *api-service
    profiles: ["dedicated-worker"]
    command: ["node", "apps/api/dist/src/worker.js"]
    environment:
      <<: *api-environment
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=160}
      BACKGROUND_JOBS_ENABLED: "true"
    mem_limit: ${WORKER_MEMORY_LIMIT:-256m}
    cpus: ${WORKER_CPU_LIMIT:-0.5}
    pids_limit: ${WORKER_PIDS_LIMIT:-96}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE:-project-call-center-web:0.5.0}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "127.0.0.1:${WEB_LOOPBACK_PORT:-18801}:8080"
    networks:
      - call-center
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-64m}
    cpus: ${WEB_CPU_LIMIT:-0.25}
    pids_limit: ${WEB_PIDS_LIMIT:-64}
    logging: *default-logging
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /var/cache/nginx:size=8m,mode=0755
      - /var/run:size=2m,mode=0755
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 20

networks:
  call-center:
    name: project-call-center-network

volumes:
  postgres-data:
    name: project-call-center-postgres-production
  recordings-data:
    name: project-call-center-recordings-production

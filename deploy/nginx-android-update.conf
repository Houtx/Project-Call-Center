server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name call.haoyunqiankun.com;

    root /opt/project-call-center-update/public;
    server_tokens off;
    access_log /var/log/nginx/call-update.access.log;
    error_log /var/log/nginx/call-update.error.log;

    ssl_certificate /etc/letsencrypt/live/call.haoyunqiankun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/call.haoyunqiankun.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok\n";
    }

    location = /release.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location ^~ /releases/ {
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name call.haoyunqiankun.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://call.haoyunqiankun.com$request_uri;
    }
}

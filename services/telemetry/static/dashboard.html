<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>外呼运营统计</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Project Call Center</p>
      <h1>外呼运营统计</h1>
    </div>
    <div class="header-actions">
      <select id="range" aria-label="统计时间范围">
        <option value="7">近 7 天</option>
        <option value="30" selected>近 30 天</option>
        <option value="90">近 90 天</option>
        <option value="365">近 365 天</option>
      </select>
      <button id="refresh" type="button">刷新数据</button>
      <button id="apk-open" class="secondary" type="button">下载最新 APK</button>
      <button id="password-open" class="secondary" type="button">修改密码</button>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="__CSRF_TOKEN__">
        <button class="secondary" type="submit">退出</button>
      </form>
    </div>
  </header>

  <main class="dashboard">
    <p id="notice" class="notice"></p>
    <section id="metrics" class="metrics-grid" aria-label="核心指标"></section>

    <section class="dashboard-section">
      <div class="section-heading">
        <div><h2>每日趋势</h2><p>活跃安装与外呼量按日汇总</p></div>
        <span id="updated-at" class="muted"></span>
      </div>
      <div id="trend" class="trend-chart" role="img" aria-label="每日外呼趋势"></div>
    </section>

    <section class="split-grid">
      <div class="dashboard-section"><h2>版本与设备</h2><div id="versions" class="bar-list"></div><div id="android" class="bar-list compact"></div></div>
      <div class="dashboard-section"><h2>使用模式</h2><div id="modes" class="bar-list"></div></div>
      <div class="dashboard-section"><h2>地区概览</h2><div id="countries" class="bar-list"></div><div id="timezones" class="bar-list compact"></div></div>
    </section>

    <section class="dashboard-section">
      <div class="section-heading"><div><h2>最近活跃安装</h2><p>随机标识和 IP 均经过脱敏，明细按保留周期自动清理</p></div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>最后活跃</th><th>安装标识</th><th>模式</th><th>APP</th><th>Android</th><th>国家/时区</th><th>脱敏 IP</th></tr></thead>
          <tbody id="recent"></tbody>
        </table>
      </div>
    </section>
    <div id="loading" class="loading-overlay" hidden><div class="loading-box"><span class="spinner"></span><strong>正在加载统计</strong></div></div>
    <p id="error" class="page-error" hidden></p>
  </main>

  <dialog id="password-dialog" aria-labelledby="password-title">
    <form id="password-form" class="password-form">
      <input type="hidden" name="csrf" value="__CSRF_TOKEN__">
      <h2 id="password-title">修改管理员密码</h2>
      <label for="current-password">当前密码</label>
      <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
      <label for="new-password">新密码</label>
      <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <label for="confirm-password">确认新密码</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <p id="password-error" class="form-error" aria-live="polite" hidden></p>
      <div class="dialog-actions">
        <button id="password-cancel" class="secondary" type="button">取消</button>
        <button id="password-submit" type="submit">确认修改</button>
      </div>
    </form>
  </dialog>
  <dialog id="apk-dialog" aria-labelledby="apk-title">
    <div class="apk-dialog-panel">
      <h2 id="apk-title">下载最新 APK</h2>
      <div id="apk-loading" class="dialog-loading" role="status">
        <span class="spinner"></span>
        <strong>正在读取最新版本</strong>
      </div>
      <div id="apk-content" hidden>
        <div class="apk-layout">
          <div id="apk-qr" class="apk-qr"></div>
          <dl class="apk-details">
            <dt>最新版本</dt>
            <dd id="apk-version"></dd>
            <dt>安装包</dt>
            <dd id="apk-filename"></dd>
            <dt>文件大小</dt>
            <dd id="apk-size"></dd>
          </dl>
        </div>
        <div class="dialog-actions">
          <button class="secondary apk-close" type="button">关闭</button>
          <a id="apk-download" class="button-link" href="/" download>下载 APK</a>
        </div>
      </div>
      <div id="apk-error" hidden>
        <p id="apk-error-message" class="form-error" aria-live="polite"></p>
        <div class="dialog-actions">
          <button class="secondary apk-close" type="button">关闭</button>
          <button id="apk-retry" type="button">重新加载</button>
        </div>
      </div>
    </div>
  </dialog>
  <script src="/assets/qrcode.js" defer></script>
  <script src="/assets/dashboard.js" defer></script>
</body>
</html>
